framework:
    rate_limiter:
        # Connexion : par (IP, e-mail). Verrouillage temporel (§3.2 sc.4).
        # Limites surchargeables par env (défaut = prod) ; relâchées uniquement en E2E.
        login:
            policy: sliding_window
            limit: '%env(int:RL_LOGIN_LIMIT)%'
            interval: '15 minutes'
            cache_pool: cache.app
            lock_factory: null
        # Inscription : par IP (anti-abus, §3.1).
        register:
            policy: sliding_window
            limit: '%env(int:RL_REGISTER_LIMIT)%'
            interval: '1 hour'
            cache_pool: cache.app
            lock_factory: null
        # Mot de passe oublié : par (IP, e-mail) (§3.4, anti-abus).
        forgot:
            policy: sliding_window
            limit: '%env(int:RL_FORGOT_LIMIT)%'
            interval: '1 hour'
            cache_pool: cache.app
            lock_factory: null
        # Export RGPD : par utilisateur (anti-abus de génération d'archives, US-SET-4).
        rgpd_export:
            policy: sliding_window
            limit: '%env(int:RL_RGPD_EXPORT_LIMIT)%'
            interval: '1 hour'
            cache_pool: cache.app
            lock_factory: null
        # Step-up admin technique : anti brute-force du mot de passe sur une session admin volée
        # (cdc §6.2). Par (IP, utilisateur).
        admin_step_up:
            policy: sliding_window
            limit: '%env(int:RL_ADMIN_STEP_UP_LIMIT)%'
            interval: '15 minutes'
            cache_pool: cache.app
            lock_factory: null
