security:
    # Hachage Argon2id (sodium) — invariant sécurité (cdc §3.1, §7).
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: sodium

    # Provider basé sur l'entité User (identifiant = e-mail, citext).
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js|assets|build)/
            security: false

        # API REST (mobile + web) : sans état, JWT (header Bearer OU cookie HttpOnly — décision D2).
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

        # Front web server-rendered (écrans/coquille) — étoffé au Lot 11. JWT en cookie également.
        main:
            lazy: true
            provider: app_user_provider
            jwt:
                authenticator: lexik_jwt_authentication.security.jwt_authenticator

    # Seule la *première* règle correspondante s'applique.
    access_control:
        # Endpoints publics : auth et documentation OpenAPI.
        - { path: '^/api/(auth|docs)', roles: PUBLIC_ACCESS }
        # Administration technique RGPD (cdc §6.2) : ROLE_ADMIN (dérivé de User::getRoles, jamais
        # dans le JWT — revérifié en base). L'auth *renforcée* (step-up) est en plus imposée par
        # AdminAccess sur /api/admin/rgpd/*. Placé AVANT la règle générique (premier match gagnant).
        - { path: ^/api/admin, roles: ROLE_ADMIN }
        # Tout le reste de l'API exige une authentification (dont l'acceptation d'invitation,
        # nominative : l'utilisateur doit être connecté pour que son e-mail soit vérifié).
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # bcrypt minimal
                time_cost: 3 # argon minimal
                memory_cost: 10 # argon minimal
