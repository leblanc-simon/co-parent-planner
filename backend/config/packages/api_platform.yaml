api_platform:
    title: CoParentPlanner API
    version: 1.0.0
    description: 'API REST de CoParentPlanner (source de vérité du client mobile généré).'
    # Formats exposés : JSON (mobile + Stimulus) et JSON-LD (Hydra).
    formats:
        json: ['application/json']
        jsonld: ['application/ld+json']
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
