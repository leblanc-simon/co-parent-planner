
services:
###> doctrine/doctrine-bundle ###
  database:
    ports:
      - "5432"
###< doctrine/doctrine-bundle ###

###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###

###> symfony/mercure-bundle ###
  mercure:
    # Port hôte **fixe** (comme la stack `infra/`) : avec un port aléatoire, `MERCURE_PUBLIC_URL`
    # changeait à chaque recréation du conteneur et les valeurs par défaut de `.env` ne pouvaient
    # pas être justes (revue C11).
    ports:
      - "3000:80"
###< symfony/mercure-bundle ###
