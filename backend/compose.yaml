
services:
###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

###> symfony/mercure-bundle ###
  mercure:
    # Protocole 1.0 (jetons RFC 9068, `match=`). Version épinglée : la bascule 0.x → 1.0 a
    # cassé le temps réel sans prévenir tant que l'image suivait `latest`.
    image: dunglas/mercure:v1.1.2
    restart: unless-stopped
    environment:
      # HTTPS **désactivé** en développement : avec le SERVER_NAME par défaut, le hub répondait
      # `308 → https://127.0.0.1/.well-known/mercure` alors que rien n'écoute en 443, rendant le
      # temps réel inexerçable hors stack Docker complète (revue 2026-08 C11). Même réglage que
      # `infra/docker-compose.yml`, seule configuration où le temps réel fonctionnait.
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
      MERCURE_SUBSCRIBER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
      # Émetteur de confiance : égal au `iss` des jetons de l'app (MERCURE_JWT_ISSUER de `.env`).
      MERCURE_TRUSTED_ISSUERS: 'https://localhost'
      # Origines du front `symfony serve` : les deux hôtes servis par le serveur local. L'abonnement
      # est **authentifié par cookie** (`<turbo-mercure-stream-source private>`), donc l'origine doit être
      # listée explicitement — un `*` interdirait l'envoi des identifiants. `cookie_name` : nom sans
      # préfixe `__Secure-` (HTTP), identique à MERCURE_COOKIE_NAME de l'app.
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://127.0.0.1:8000 http://localhost:8000
        cookie_name mercure_access_token
    healthcheck:
      # `/healthz` a disparu en 1.0 ; sonde de disponibilité de l'API d'administration Caddy.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/mercure/health/ready"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - mercure_data:/data
      - mercure_config:/config
###< symfony/mercure-bundle ###

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###

###> symfony/mercure-bundle ###
  mercure_data:
  mercure_config:
###< symfony/mercure-bundle ###
