api_platform:
    title: CoParentPlanner API
    version: 1.0.0
    description: 'API REST de CoParentPlanner (source de vérité du client mobile généré).'
    # Formats exposés : JSON (mobile + Stimulus) et JSON-LD (Hydra).
    formats:
        json: ['application/json']
        jsonld: ['application/ld+json']
    # PATCH : accepte merge-patch+json (standard) et application/json (commodité client).
    patch_formats:
        json: ['application/merge-patch+json', 'application/json']
    # Documentation : /api/docs.json (OpenAPI), Swagger UI HTML, variantes JSON-LD/OpenAPI.
    docs_formats:
        json: ['application/json']
        jsonld: ['application/ld+json']
        jsonopenapi: ['application/vnd.openapi+json']
        html: ['text/html']
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
