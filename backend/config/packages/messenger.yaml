framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            # sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async

            # E-mails transactionnels d'auth, traités hors requête (§3.1, §4.6).
            App\Message\SendAuthEmail: async
            # E-mail d'invitation : async (découple la création d'invitation ; rend effectif le
            # chiffrement-en-transit du token dans la file — §3.3.B).
            App\Message\SendInvitationEmail: async
            # Garde (Lot 3) : génération/import asynchrones, idempotents.
            App\Message\RegenerateCustody: async
            App\Message\ImportSchoolHolidays: async

when@test:
    framework:
        messenger:
            transports:
                # En test, le transport async est en mémoire : on inspecte les messages dispatchés
                # (récupération du jeton clair pour valider register → verify).
                async: 'in-memory://'
