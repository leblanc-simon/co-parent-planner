# Catalogue fr-FR (format ICU). Ajouter une langue = nouveau fichier, sans changement de code.

email:
    verification:
        subject: 'Vérifiez votre adresse e-mail — CoParentPlanner'
        title: 'Bienvenue sur CoParentPlanner'
        intro: 'Pour activer votre compte, confirmez votre adresse e-mail en cliquant sur le bouton ci-dessous.'
        cta: 'Vérifier mon e-mail'
        ignore: "Si vous n'êtes pas à l'origine de cette inscription, ignorez cet e-mail."
    reset:
        subject: 'Réinitialisation de votre mot de passe — CoParentPlanner'
        title: 'Réinitialisation du mot de passe'
        intro: 'Vous avez demandé à réinitialiser votre mot de passe. Cliquez sur le bouton ci-dessous pour en choisir un nouveau.'
        cta: 'Choisir un nouveau mot de passe'
        ignore: "Si vous n'êtes pas à l'origine de cette demande, ignorez cet e-mail : votre mot de passe reste inchangé."
    password_changed:
        subject: 'Votre mot de passe a été modifié — CoParentPlanner'
        title: 'Mot de passe modifié'
        body: 'Votre mot de passe vient d''être modifié. Toutes vos sessions ont été déconnectées.'
        warning: "Si vous n'êtes pas à l'origine de ce changement, contactez-nous immédiatement."
    invitation:
        subject: 'Vous êtes invité·e à rejoindre {family} sur CoParentPlanner'
        title: 'Invitation à rejoindre une famille'
        intro: 'Vous avez été invité·e à rejoindre la famille « {family} » sur CoParentPlanner. Cliquez ci-dessous pour accepter l''invitation.'
        cta: "Rejoindre la famille"
        ignore: "Si vous ne vous attendiez pas à cette invitation, ignorez simplement cet e-mail."
    notif:
        cta: "Ouvrir CoParentPlanner"
        footer: "Vous recevez cet e-mail selon vos préférences de notification. Gérez-les dans l'application."
        exchange_message:
            subject: "Nouveau message : {title}"
            body: "Un nouveau message a été posté dans l'échange « {title} ». Ouvrez l'application pour le lire."
        exchange_opened:
            subject: "Nouvel échange : {title}"
            body: "Un nouvel échange « {title} » a été ouvert dans votre famille."
        exchange_decided:
            subject: "Décision prise : {title}"
            body: "La décision « {title} » a été tranchée. Ouvrez l'application pour voir l'option retenue."
        exchange_closed:
            subject: "Échange clos : {title}"
            body: "L'échange « {title} » a été clôturé."
        decision_reminder:
            subject: "Échéance demain : {title}"
            body: "La décision « {title} » arrive à échéance demain et n'est pas encore tranchée."
        decision_overdue:
            subject: "En retard : {title}"
            body: "La décision « {title} » a dépassé son échéance sans être tranchée."
        agenda_event_created:
            subject: "Nouvel événement : {title}"
            body: "Un nouvel événement « {title} » a été ajouté à l'agenda familial."
        agenda_event_updated:
            subject: "Événement modifié : {title}"
            body: "L'événement « {title} » a été modifié. Ouvrez l'agenda pour voir les détails."
        agenda_event_deleted:
            subject: "Événement annulé : {title}"
            body: "L'événement « {title} » a été annulé."
        agenda_reminder:
            subject: "Rappel : {title}"
            body: "L'événement « {title} » approche. Consultez votre agenda."
        custody_changed:
            subject: "Planning de garde modifié"
            body: "Le planning de garde de votre famille a été modifié. Consultez-le dans l'application."
            # Variante nommée (E3), employée quand la modification porte sur UN jour identifié :
            # `{household}` est « Sophie » ou « Sophie et Bob » selon l'association parent ↔
            # beau-parent, composée par `Household` à partir du catalogue (`household.pair`).
            body_day: "Le {date} est désormais chez {household}. Consultez le planning dans l'application."
        # Dépenses (Lot 10). Le modèle et l'API parlent d'état `settled` (clé stable, non traduite) ;
        # l'utilisateur, lui, lit « réglée » — le cdc §2.9 disait « remboursée ». L'écart de
        # vocabulaire tient donc dans ce catalogue, jamais dans le code ni dans le contrat.
        expense_added:
            subject: "Nouvelle dépense : {title}"
            body: "Une nouvelle dépense « {title} » a été enregistrée dans les comptes partagés."
        expense_settled:
            subject: "Dépense réglée : {title}"
            body: "La dépense « {title} » a été marquée réglée."
        expense_reminder:
            subject: "Rappel : {title} reste à régler"
            body: "La dépense « {title} » n'est pas réglée. Ouvrez l'application pour consulter le solde."

# Notifications push mobile (Lot 11). Titre court + corps d'une ligne : l'écran verrouillé tronque
# au-delà. Jamais de champ 🔒 (texte de message, prénom, nom de foyer) — le payload transite par
# Google et Apple ; `{title}` est le titre non chiffré de la ressource, celui qu'affiche l'e-mail.
push:
    notif:
        exchange_message:
            title: "Nouveau message"
            body: "Dans l'échange « {title} »"
        exchange_opened:
            title: "Nouvel échange"
            body: "« {title} » vient d'être ouvert"
        exchange_decided:
            title: "Décision prise"
            body: "« {title} » a été tranchée"
        exchange_closed:
            title: "Échange clos"
            body: "« {title} » a été clôturé"
        decision_reminder:
            title: "Échéance demain"
            body: "« {title} » n'est pas encore tranchée"
        decision_overdue:
            title: "Décision en retard"
            body: "« {title} » a dépassé son échéance"
        agenda_event_created:
            title: "Nouvel événement"
            body: "« {title} » ajouté à l'agenda"
        agenda_event_updated:
            title: "Événement modifié"
            body: "« {title} » a changé"
        agenda_event_deleted:
            title: "Événement annulé"
            body: "« {title} » a été annulé"
        agenda_reminder:
            title: "Rappel"
            body: "« {title} » approche"
        custody_changed:
            title: "Planning de garde modifié"
            body: "Consultez le nouveau planning"
        expense_added:
            title: "Nouvelle dépense"
            body: "« {title} » ajoutée aux comptes partagés"
        expense_settled:
            title: "Dépense réglée"
            body: "« {title} » a été marquée réglée"
        expense_reminder:
            title: "Dépense à régler"
            body: "« {title} » n'est pas encore réglée"

household:
    # Nomme le foyer d'un parent associé à un beau-parent (évolutions E2/E3). Composée ICI et non en
    # PHP : la conjonction et l'ordre des deux noms changent d'une langue à l'autre.
    pair: '{parent} et {partner}'


